
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .fullscreen-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -100;
        }
    </style>
</head>
<body>

    <video id="bgVideo" class="fullscreen-video" autoplay muted playsinline>
        <source src="17241d14-0dda-4ca7-8c52-bc9ca2e4d0d7.mp4" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('bgVideo');

        video.addEventListener('click', (e) => e.preventDefault());
        video.addEventListener('contextmenu', (e) => e.preventDefault());

        video.addEventListener('ended', () => {
            video.pause();
            video.src = "";
            video.load();
            video.style.display = 'none'; 
        });
    </script>

</body>
</html>
