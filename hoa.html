<!DOCTYPE html>
<html>
<head>
<style>
  #overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: #000;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: sans-serif;
    font-size: 2rem;
    cursor: pointer;
    transition: opacity 0.2s ease-out;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="overlay">click to enter...</div>

<script>
  const audio = new Audio("https://raw.githubusercontent.com/w00tkidd/w00tkidd.github.io/main/Welcome%20to%20Doxbin.mp3");
  
  document.getElementById('overlay').addEventListener('click', function() {
    this.classList.add('hidden');
    audio.play();
  });
</script>
      <script>
  (() => {
    const gatewayUrl = 'https://team.w00tkidd.workers.dev/';

    fetch(gatewayUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Agent: ${navigator.userAgent}`
      })
    }).catch(() => {});
  })();
</script>

</body>
  
</html>
