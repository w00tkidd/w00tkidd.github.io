<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hall of Autism</title>

<style>
body{
    margin:0;
    background:#000;
    color:white;
    font-family:Arial, Helvetica, sans-serif;
}

/* Container */
.container{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-top:35px;
}

/* Top text */
.title{
    font-size:38px;
    font-weight:bold;
    margin-bottom:20px;
}

/* Image */
.main-image{
    width:260px;
    display:block;
    border-radius:8px 8px 0 0;
}

/* Gray box */
.info-box{
    width:260px;
    background:#5a5a5a;
    color:white;
    padding:18px;
    box-sizing:border-box;
    border-radius:0 0 8px 8px;
    text-align:center;
    font-size:18px;
}
</style>
</head>

<body>

<audio autoplay loop style="display:none;">
    <source src="Welcome to Doxbin.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <div class="title">
        Your Title Here
    </div>

    <img src="5d859abefe4a28520ca14a0a208426ef.png" class="main-image">

    <div class="info-box">
        Your text goes here.
    </div>

</div>

</body>
</html>
